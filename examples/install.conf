# Answers file for unattended installs:  ./install.sh --yes --config examples/install.conf
# KEY=value per line. Values are taken literally (no shell expansion); quotes around a value are optional.
# Leave a key out to get its default; command-line flags override values here.

# development | production
MODE=production

# version-16, version-15, develop, a tag such as v15.50.0, or "latest" (newest stable)
FRAPPE_BRANCH=latest
# Only needed for a branch or tag with no version in its name:
# FRAPPE_MAJOR=15

# Defaults are the versions recommended for the Frappe release.
# PYTHON_VERSION=3.11
# NODE_VERSION=18

# Official apps, comma separated (dependencies are added automatically). Empty = Frappe only.
APPS=erpnext,hrms
# Your own apps (git URLs, space or comma separated) and branch overrides (app=branch).
# CUSTOM_APPS=https://github.com/me/my_app
# APP_BRANCHES=my_app=main,hrms=version-15

BENCH_NAME=frappe-bench

# CREATE_SITE=no skips site creation.
SITE_NAME=erp.example.com
# all | none | comma separated subset of the apps above
SITE_APPS=all

# Production only.
DNS_MULTITENANT=yes
# Set an email to get a Let's Encrypt certificate (DNS must already point to this machine).
LETSENCRYPT_EMAIL=

# Owner of the bench when the installer is started as root (created if missing).
FRAPPE_USER=frappe

# Your own passwords. Secrets are better passed as environment variables. If you put them here,
# chmod 600 this file. Left unset, interactive runs ask (Enter = generate a strong one).
# MariaDB root:
# DB_ROOT_PASSWORD=
# Administrator login of the new site:
# ADMIN_PASSWORD=
# Login password of the Linux user created when the installer is started as root:
# FRAPPE_USER_PASSWORD=
