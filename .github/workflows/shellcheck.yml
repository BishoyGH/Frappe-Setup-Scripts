name: shellcheck

on:
  # Only when shell scripts change; push only on the default branch (PRs cover the rest).
  push:
    branches: [claude/project-thread-wrx4t9, main]
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  workflow_dispatch:

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -x *.sh lib/*.sh
      - name: Syntax check
        run: for f in *.sh lib/*.sh; do bash -n "$f"; done
